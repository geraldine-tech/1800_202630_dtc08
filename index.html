<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">

    <!-- Other libraries go here -->

</head>

<body>

    <nav class="navbar navbar-expand-sm bg-success-subtle" aria-label="Main navigation">
        <div class="container-fluid">

            <!-- Logo and Brand -->
            <a class="navbar-brand" href="index.html">
                <img src="images/healthy.jpg" height="36" alt="Healthy Eating logo">
                Healthy Eating
            </a>

            <!-- Mobile Menu Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links and Search -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            My Account
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#my-food">My Food</a></li>
                            <li><a class="dropdown-item" href="#favorites">Favorites</a></li>
                        </ul>
                    </li>
                </ul>

                <!-- Search Bar -->
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search meals..." aria-label="Search">
                    <button class="btn btn-outline-dark" type="submit">
                        Search
                    </button>
                </form>
            </div>
    </nav>

    <!-- Hero Section Starts -->
    <div class="hero hero-section navbar-sage px-3 py-5 my-2 mx-2 text-center">
        <img class="d-block mx-auto mb-4" src="./images/healthy.jpg" alt="Healthy Eating logo" width="72" height="57">

        <h1 class="display-5 fw-bold text-success-emphasis">
            Let's begin your Healthy Eating journey!
        </h1>

        <div class="col-lg-6 mx-auto">
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            </div>
        </div>
    </div>


    <!-- LOGIN / CTA -->
    <div class="container d-flex justify-content-center py-5">
        <div class="w-100" style="max-width: 400px;">

            <h1 class="h3 fw-bold mb-4">Log in</h1>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password"
                        required>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Login
                </button>
            </form>

        </div>
    </div>

    <nav class="navbar fixed-bottom bg-success-subtle border-top" aria-label="Footer navigation">
        <div class="container-fluid ">
            <div class="d-flex justify-content-around w-100">

                <a href="index.html" class="nav-link flex-fill text-center text-success py-2">
                    <i class="bi bi-house-door fs-4 d-block"></i>
                    <small>Home</small>
                </a>

                <a href="favorites.html" class="nav-link flex-fill text-center py-2 text-secondary">
                    <i class="bi bi-bookmark fs-4 d-block"></i>
                    <small>favorites</small>
                </a>

                <a href="learn.html" class="nav-link flex-fill text-center py-2 text-secondary">
                    <i class="bi bi-book-half fs-4 d-block"></i>
                    <small>Learn</small>
                </a>

                <a href="profile.html" class="nav-link flex-fill text-center py-2 text-secondary">
                    <i class="bi bi-person-circle fs-4 d-block"></i>
                    <small>Profile</small>
                </a>

            </div>
        </div>
    </nav>

    <!-- Copyright Footer -->
    <footer class="text-center py-3 mb-5">
        <small class="text-secondary">
            &copy; 2026 Healthy Eating. All rights reserved.
        </small>
    </footer>

    <script type="module" src="./src/main.js">
    </script>
</body>


</html>
