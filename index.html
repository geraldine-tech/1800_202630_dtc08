<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./index.css">

    <!-- Other libraries go here -->

</head>

<body>
     <div class="cta">
        <div class="cta_wrapper">
            <h1 class="cta_title">Log in</h1>
            <field class="cta_input_field">
                <input type="text" class="cta_email">
                <span class="cta_span">Email</span>
            </field>
            <field class="cta_input_field">
                <input type="text" class="cta_password">
                <span class="cta_span">Password</span>
            </field>
            <div class="cta_remember_wrapper">
                <input type="checkbox" name="" id="" class="cta-checkbox">
                <p class="cta-checkbox-p">Remember me</p>
            </div>
            <button class="cta_confirm">Login</button>
        </div>
     </div>
</body>

</html>
